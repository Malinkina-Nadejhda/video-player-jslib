<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    .player-wrapper {
      width: 800px;
      height: 600px;
      box-shadow: 0 0 20px 5px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      }

    .video-frame {
      flex-grow: 1;
      }

    .controls-panel {
      background-color: black;
      display: flex;
      }

      .spacer {
      flex-grow: 1
      }

    .control-button {
      border: none;
      font-size: 25px;
      width: 50px;
      height: 40px;
      margin: 0 5px;
      background-color: transparent;
      cursor: pointer;
      color: white;
    }
  </style>
</head>
<body>
<div id="player" class="player-wrapper">
  <div class="video-frame js-video-container" ></div>

    <div class="controls-panel">
      <button class="control-button js-play-button">
        <i class="fa fa-play" aria-hidden="true"></i>
      </button>
      <button class="control-button js-pause-button" hidden>
        <i class="fa fa-pause" aria-hidden="true"></i>
      </button>
      <button class="control-button js-volume-button">
        <i class="fa fa-volume-off" aria-hidden="true"></i>
      </button>
      <button class="control-button js-mute-button" hidden>
        <i class="fa fa-volume-up" aria-hidden="true"></i>
      </button>

      <div class="spacer"></div>

      <button class="control-button js-fullscreen-button">
        <i class="fa fa-arrows-alt" aria-hidden="true"></i>
      </button>

    </div>

</div>

  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
  <script src="player.js"></script>

  <script type="text/javascript">
    createPlayer({elementId: 'player'});
  </script>
</body>
</html>
